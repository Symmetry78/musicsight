<!DOCTYPE html>
<head>
    <title>Music Sight - Login</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <nav class="topnav">
        <div class="nav-container">
            <div class="nav-links">
                <a href="main.html">Home</a>
                <a href="library.html">Library</a>
                <a href="contact.html">Contact</a>
                <a href="login.html">Login</a>
            </div>
            <img src="Music Sight Logo.png" alt="Music Sight Logo" class="logo">
        </div>
    </nav>

    <header class="header">
        <h1>Music Sight</h1>
        <p class="tagline">Sign in to access your music</p>
        <div class="search-container">
            <input type="text" placeholder="Search for songs, artists, albums..." class="search-bar">
            <button class="search-btn">Search</button>
        </div>
    </header>

    <main class="content">
        <section class="section">
            <h2>Register for an account!</h2>
            <p style="color: #b0b0b0; margin-bottom: 30px; text-align: center;">Welcome!</p>
            
            <div class="responsive-form">
                <form action="">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username or email" required>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <input type="submit" value="Sign In">
                    <div class="signup-prompt">
                        <p>Already have an account? <a href="login.html" class="signup-link">Login</a></p>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>Music Sight</p>
    </footer>

</body>
</html>
