<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Sight - Contact Us</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="topnav">
        <div class="nav-container">
            <div class="nav-links">
                <a href="main.html">Home</a>
                <a href="library.html">Library</a>
                <a class="active" href="contact.html">Contact</a>
                <a href="login.html">Login</a>
            </div>
            <img src="Music Sight Logo.png" alt="Music Sight Logo" class="logo">
        </div>
    </nav>

    <!-- Header with Search -->
    <header class="header">
        <h1>Music Sight</h1>
        <p class="tagline">Get in touch with us</p>
        <div class="search-container">
            <input type="text" placeholder="Search for songs, artists, albums..." class="search-bar">
            <button class="search-btn">Search</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="content">
        <section class="section">
            <h2>Contact Us</h2>
            <p style="color: #b0b0b0; margin-bottom: 30px; text-align: center;">Have a question or feedback? We'd love to hear from you!</p>
            
            <div class="responsive-form">
                <form action="">
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" name="fname" placeholder="Your first name" required>

                    <label for="lname">Last Name</label>
                    <input type="text" id="lname" name="lname" placeholder="Your last name" required>

                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your.email@example.com" required>

                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="What's this about?">

                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>

                    <input type="submit" value="Send Message">
                </form>
            </div>
        </section>

        <!-- Contact Info Section -->
        <section class="section" style="margin-top: 60px;">
            <h2>Other Ways to Reach Us</h2>
            <div class="contact-info">
                <div class="contact-card">
                    <h3>Email Support</h3>
                    <p>support@musicsight.com</p>
                </div>
                <div class="contact-card">
                    <h3>Business Inquiries</h3>
                    <p>business@musicsight.com</p>
                </div>
                <div class="contact-card">
                    <h3>Social Media</h3>
                    <p>@MusicSight on all platforms</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>Music Sight</p>
    </footer>

</body>
</html>
